name: Scale and coverage evidence

# The fast correctness gate in ci.yml stays fast. This workflow produces the
# slower evidence: the frozen scale profiles measured against their release
# budgets, and a branch-coverage report of the default suite. It runs on a
# schedule, on demand, and for pull requests a maintainer labels `performance`.
# A budget violation fails the job and is reported with the environment it was
# measured on; nothing here retries until a passing sample appears. The stored
# JSON identifies each runner; local measurements do not establish calibration
# for GitHub-hosted runners.

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: Scale profile to measure
        type: choice
        default: standard
        options:
          - standard
          - near-partition
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: scale-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  scale:
    name: Scale budgets
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'performance')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --editable ".[dev]"

      - name: Measure the selected profiles against their release budgets
        shell: bash
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          # Scheduled runs measure both frozen profiles; a dispatch measures the
          # one it asked for; a labelled pull request measures the standard one.
          case "$GITHUB_EVENT_NAME" in
            schedule) profiles="standard near-partition" ;;
            workflow_dispatch) profiles="${REQUESTED_PROFILE:-standard}" ;;
            *) profiles="standard" ;;
          esac
          status=0
          for profile in $profiles; do
            echo "::group::scale profile $profile"
            .venv/bin/python tools/scale_benchmark.py \
              --profile "$profile" \
              --require-budget \
              --output "scale-benchmark-${profile}-${GITHUB_SHA}.json" || status=$?
            echo "::endgroup::"
          done
          exit "$status"

      - name: Store each measurement keyed to the commit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scale-benchmark-${{ github.sha }}
          path: scale-benchmark-*-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 90

  coverage:
    name: Branch coverage of the default suite
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'performance')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --editable ".[dev]"

      - name: Run the default suite under branch coverage, subprocesses included
        shell: bash
        run: |
          .venv/bin/python tools/coverage_report.py snapshot --source-manifest coverage-source.json
          .venv/bin/python tools/run_test_groups.py --coverage

      - name: Generate coverage reports even when a test fails
        if: always()
        shell: bash
        run: |
          .venv/bin/python tools/coverage_report.py report --source-manifest coverage-source.json

      - name: Store the coverage evidence keyed to the commit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage-source.json
            coverage-evidence/
            suite-evidence/
            .coverage*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
