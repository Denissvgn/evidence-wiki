name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Local mode replaces every hosted suite and compatibility cell with authenticated
  # local evidence, so these jobs run only in the hosted fallback.
  compatibility:
    if: vars.LOCAL_CI_ENABLED != 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/check-compatibility.yml

  test:
    name: ${{ matrix.platform.name }} / shard ${{ matrix.shard }}
    needs: compatibility
    if: vars.LOCAL_CI_ENABLED != 'true' || github.event_name != 'pull_request'
    env:
      EVIDENCE_WIKI_EXPECTED_PYTHON: ${{ matrix.platform.python-version }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        platform:
          - name: Ubuntu / Python 3.14
            os: ubuntu-latest
            python-version: "3.14.7"
          - name: macOS / Python 3.14
            os: macos-latest
            python-version: "3.14.7"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.platform.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and verify optional Poppler compatibility backend
        if: matrix.platform.name == 'Ubuntu / Python 3.14'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v

      - name: Install development environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --editable ".[dev]"

      - name: Check pinned compatibility
        shell: bash
        run: .venv/bin/python tools/check_ci_compatibility.py

      - name: Retain pinned compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-compatibility-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-${{ matrix.platform.python-version }}-cell-${{ matrix.shard }}
          path: compatibility-evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Run tests and quality checks
        shell: bash
        run: |
          .venv/bin/python tools/run_test_groups.py --group-size 48 --shard-count 3 --shard-index ${{ matrix.shard }}
          .venv/bin/python -m ruff check .
          .venv/bin/python tools/sync_vendored_scripts.py --check

      - name: Retain suite outcomes and process evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform.python-version }}-shard-${{ matrix.shard }}
          path: suite-evidence/
          if-no-files-found: warn
          retention-days: 90

  build:
    name: Build wheel and source archive
    runs-on: ubuntu-latest
    if: vars.LOCAL_CI_ENABLED != 'true' || github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --editable ".[dev]"

      - name: Build and inspect wheel and sdist
        shell: bash
        run: |
          .venv/bin/python -m build --wheel --sdist --no-isolation
          .venv/bin/python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: Store this run's candidate distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-dist-${{ github.sha }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  installed-wheel:
    if: vars.LOCAL_CI_ENABLED != 'true' || github.event_name != 'pull_request'
    needs: [build]
    uses: ./.github/workflows/qualify-installation.yml
    with:
      artifact: wheel
      candidate-name: ci-dist-${{ github.sha }}-${{ github.run_id }}
      report-prefix: installed-check

  installed-sdist:
    if: vars.LOCAL_CI_ENABLED != 'true' || github.event_name != 'pull_request'
    needs: [build]
    uses: ./.github/workflows/qualify-installation.yml
    with:
      artifact: sdist
      candidate-name: ci-dist-${{ github.sha }}-${{ github.run_id }}
      report-prefix: installed-check

  installed:
    if: vars.LOCAL_CI_ENABLED != 'true' || github.event_name != 'pull_request'
    needs: [installed-wheel, installed-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wheel-report-sha256: ${{ needs.installed-wheel.outputs.report-sha256 }}
      sdist-report-sha256: ${{ needs.installed-sdist.outputs.report-sha256 }}
    steps:
      - name: Require both independent installation producers
        shell: bash
        run: |
          test '${{ needs.installed-wheel.result }}' = success
          test '${{ needs.installed-sdist.result }}' = success

  package:
    name: Build distributions
    needs: [compatibility, test, build, installed]
    if: ${{ !cancelled() && (vars.LOCAL_CI_ENABLED != 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require all producers to succeed
        shell: bash
        run: |
          test '${{ needs.compatibility.result }}' = success
          test '${{ needs.test.result }}' = success
          test '${{ needs.build.result }}' = success
          test '${{ needs.installed.result }}' = success

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Install verification environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --editable ".[dev]"

      - name: Download all suite shards from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: suite-${{ github.sha }}-*-shard-*
          path: suite-shards/

      - name: Verify complete execution on every platform
        shell: bash
        env:
          SUITE_COMMIT: ${{ github.sha }}
          SUITE_RUN_ID: ${{ github.run_id }}
        run: |
          .venv/bin/python -m tools.verify_test_shards --evidence suite-shards \
            --commit "$SUITE_COMMIT" --run-id "$SUITE_RUN_ID" --shard-count 3 --group-size 48 \
            --platform Linux/X64/3.14 --platform macOS/ARM64/3.14 \
            --python-patch Linux/X64/3.14=3.14.7 --python-patch macOS/ARM64/3.14=3.14.7

      - name: Download this run's candidate distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ci-dist-${{ github.sha }}-${{ github.run_id }}
          path: dist/

      - name: Download both successful installation reports
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: installed-check-${{ github.sha }}-${{ github.run_id }}-*
          path: installed-checks/

      - name: Verify both installations and complete scenario coverage
        shell: bash
        env:
          VALIDATION_COMMIT: ${{ github.sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          WHEEL_REPORT_SHA256: ${{ needs.installed.outputs.wheel-report-sha256 }}
          SDIST_REPORT_SHA256: ${{ needs.installed.outputs.sdist-report-sha256 }}
        run: |
          .venv/bin/python -m tools.verify_installed_artifacts --dist-dir dist \
            --evidence installed-checks --commit "$VALIDATION_COMMIT" --run-id "$VALIDATION_RUN_ID" \
            --report-sha256 "$WHEEL_REPORT_SHA256" --report-sha256 "$SDIST_REPORT_SHA256"

  linux-native:
    name: Native Linux peer architecture contract
    if: vars.LOCAL_CI_ENABLED == 'true' && github.event_name == 'pull_request'
    runs-on: ${{ vars.LOCAL_CI_LINUX_ARCH == 'X64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run the native peer selection
        env:
          PEER_ARCH: ${{ vars.LOCAL_CI_LINUX_ARCH == 'X64' && 'ARM64' || 'X64' }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --editable ".[dev]"
          .venv/bin/python tools/linux_architecture_probe.py --architecture "$PEER_ARCH" --output native-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-linux-peer-${{ github.run_id }}
          path: native-evidence/
          if-no-files-found: error
          retention-days: 30

  local-evidence:
    name: Require authenticated local profiles and Linux pair
    if: vars.LOCAL_CI_ENABLED == 'true' && github.event_name == 'pull_request'
    needs: [linux-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: read
    steps:
      - name: Check out trusted base verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.7"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: native-linux-peer-${{ github.run_id }}
          path: native-peer/
      - name: Verify exact local source, native peer and producer
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          LOCAL_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          python -m venv .venv
          .venv/bin/python tools/check_local_ci_status.py --repo "$GITHUB_REPOSITORY" \
            --commit "$LOCAL_COMMIT" --base "$LOCAL_BASE" --native-peer native-peer/summary.json --output local-verification

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [compatibility, test, package, local-evidence, linux-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected complete policy
        env:
          LOCAL_MODE: ${{ vars.LOCAL_CI_ENABLED == 'true' && github.event_name == 'pull_request' }}
          FALLBACK_COMPATIBILITY: ${{ needs.compatibility.result }}
          FALLBACK_TESTS: ${{ needs.test.result }}
          FALLBACK_PACKAGE: ${{ needs.package.result }}
          LOCAL_EVIDENCE: ${{ needs.local-evidence.result }}
          NATIVE_PEER: ${{ needs.linux-native.result }}
        run: |
          if [ "$LOCAL_MODE" = true ]; then
            test "$LOCAL_EVIDENCE" = success
            test "$NATIVE_PEER" = success
          else
            test "$FALLBACK_COMPATIBILITY" = success
            test "$FALLBACK_TESTS" = success
            test "$FALLBACK_PACKAGE" = success
          fi
