name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.platform.name }} / shard ${{ matrix.shard }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        platform:
          - name: Ubuntu / Python 3.10
            os: ubuntu-latest
            python-version: "3.10"
          - name: Ubuntu / Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
          - name: macOS / Python 3.12
            os: macos-latest
            python-version: "3.12"
          - name: Windows / Python 3.12
            os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.platform.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and verify optional Poppler compatibility backend
        if: matrix.platform.name == 'Ubuntu / Python 3.10'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v

      - name: Install development environment (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --editable ".[dev]"

      - name: Install development environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --editable ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests and quality checks (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          .venv/bin/python tools/run_test_groups.py --group-size 48 --shard-count 3 --shard-index ${{ matrix.shard }}
          .venv/bin/python -m ruff check .
          .venv/bin/python tools/sync_vendored_scripts.py --check

      - name: Check native Windows contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest -q -x --tb=short --durations=15 tests/test_native_filesystem.py tests/test_workspace_capture_portability.py tests/test_legacy_usage_portability.py tests/test_frameworks.py tests/test_evidence_assessments.py::test_prepare_issue_and_consume_nonfinancial_assessment tests/test_orchestration_host.py::OrchestrationHostTests::test_managed_run_completes_through_real_controller_with_fake_codex tests/test_orchestration_host.py::OrchestrationHostTests::test_managed_window_serializes_its_own_controller_calls_without_a_driver_refusal tests/test_pack_composition.py::test_composition_uses_scoped_identifiers_and_validates_materialized_bytes tests/test_pack_migrations.py::test_generic_attachment_preview_preserves_sources_and_requires_reevaluation tests/test_usage_consumers.py::test_unsupported_host_storage_fails_without_initializing tests/test_usage_consumers.py::test_host_fixture_skips_before_setup_without_supported_locking tests/test_caller_research.py::test_readonly_advice_and_no_fabricated_completion tests/test_workspace_application.py::test_empty_setup_and_replay_preserve_question tests/test_native_instructions.py tests/test_pack_authoring.py::test_replaced_output_directory_is_not_followed tests/test_market_evidence.py::test_market_capture_refuses_when_directory_descriptors_are_unavailable tests/test_caller_research.py::test_progress_has_unknown_grading_and_separate_estimates tests/test_upgrade_workspace.py::UpgradePendingOrderTests::test_upgrade_refuses_while_a_driver_holds_a_session_lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests and quality checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools/run_test_groups.py --group-size 48 --shard-count 3 --shard-index ${{ matrix.shard }} --timeout 3600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe tools\sync_vendored_scripts.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain suite outcomes and process evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform.python-version }}-shard-${{ matrix.shard }}
          path: suite-evidence/
          if-no-files-found: warn
          retention-days: 90

  package:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --editable ".[dev]"

      - name: Download all suite shards from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: suite-${{ github.sha }}-*-shard-*
          path: suite-shards/

      - name: Verify complete execution on every platform
        shell: bash
        env:
          SUITE_COMMIT: ${{ github.sha }}
          SUITE_RUN_ID: ${{ github.run_id }}
        run: |
          .venv/bin/python -m tools.verify_test_shards --evidence suite-shards \
            --commit "$SUITE_COMMIT" --run-id "$SUITE_RUN_ID" --shard-count 3 --group-size 48 \
            --platform Linux/X64/3.10 --platform Linux/X64/3.14 \
            --platform macOS/ARM64/3.12 --platform Windows/X64/3.12

      - name: Build and inspect wheel and sdist
        shell: bash
        run: |
          .venv/bin/python -m build --wheel --sdist --no-isolation
          .venv/bin/python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: Validate the built wheel and sdist through the shared installed-artifact gate
        shell: bash
        run: |
          .venv/bin/python tools/validate_installed_artifacts.py --dist-dir dist --evidence-dir reports/installed-artifacts

      - name: Retain installed qualification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/installed-artifacts/summary.json
            reports/installed-artifacts/*/journeys/*.json
            reports/installed-artifacts/*/qualification-inputs/inputs.json
          if-no-files-found: warn
          retention-days: 90
