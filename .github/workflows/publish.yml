name: Publish release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Verify release and build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the release environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --editable ".[dev]"

      - name: Validate release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          root = pathlib.Path.cwd()
          metadata = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          project = metadata["project"]
          version = project["version"]
          release_tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{version}"

          if project["name"] != "evidence-wiki":
              raise SystemExit(f"Unexpected project name: {project['name']!r}")
          if release_tag != expected_tag:
              raise SystemExit(f"Release tag {release_tag!r} must equal {expected_tag!r}")

          init_text = (root / "src/evidence_wiki/__init__.py").read_text(encoding="utf-8")
          version_match = re.search(r'^__version__\s*=\s*(?:["\'])([^"\']+)["\']\s*$', init_text, re.MULTILINE)
          if version_match is None:
              raise SystemExit("Could not find evidence_wiki.__version__")
          if version_match.group(1) != version:
              raise SystemExit(
                  f"Package version {version_match.group(1)!r} does not match pyproject version {version!r}"
              )

          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^## {re.escape(version)} - \d{{4}}-\d{{2}}-\d{{2}}$", re.MULTILINE)
          if heading.search(changelog) is None:
              raise SystemExit(f"CHANGELOG.md has no dated heading for {version}")

          print(f"Validated release identity: evidence-wiki {version} ({release_tag})")
          PY

      - name: Run release gates
        shell: bash
        run: |
          .venv/bin/python tools/run_test_groups.py
          .venv/bin/python -m ruff check .
          .venv/bin/python tools/sync_vendored_scripts.py --check
          git diff --check

      - name: Build and inspect distributions
        shell: bash
        run: |
          .venv/bin/python -m build --sdist --wheel --no-isolation
          .venv/bin/python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: Validate the built wheel and sdist through the shared installed-artifact gate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          .venv/bin/python tools/validate_installed_artifacts.py \
            --dist-dir dist \
            --expected-version "${RELEASE_TAG#v}" | tee artifact-validation.json

      - name: Measure the standard scale profile against its release budget
        shell: bash
        run: |
          .venv/bin/python tools/scale_benchmark.py \
            --profile standard \
            --require-budget \
            --output scale-benchmark-standard.json

      - name: Collect release diagnostics
        if: always()
        shell: bash
        env:
          RELEASE_GATE_STATUS: ${{ job.status }}
        run: .venv/bin/python tools/collect_release_diagnostics.py

      - name: Store release diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-diagnostics/
            suite-evidence/
            artifact-validation.json
            scale-benchmark-standard.json
          if-no-files-found: warn
          retention-days: 90

      - name: Store verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            artifact-validation.json
            scale-benchmark-standard.json
          if-no-files-found: error
          retention-days: 7

  publish-to-pypi:
    name: Publish verified distributions to PyPI
    needs: release-gate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/evidence-wiki
    permissions:
      id-token: write
    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: python-package-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
