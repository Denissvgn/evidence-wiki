name: Publish release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  release-gate:
    name: Qualify release distributions
    uses: ./.github/workflows/qualify-release.yml
    with:
      release-tag: ${{ github.event.release.tag_name }}

  publish-to-pypi:
    name: Publish verified distributions to PyPI
    needs: release-gate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/evidence-wiki
    permissions:
      id-token: write
    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: python-package-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
